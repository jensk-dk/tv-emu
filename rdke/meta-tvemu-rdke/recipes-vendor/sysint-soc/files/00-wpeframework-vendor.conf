# What Thunder's process needs of the device to draw and to play: the Pi's
# drop-in (rdkvhal-sysint-raspberrypi4, 00-wpeframework-vendor.conf) with the
# VM's display in place of the Pi's.
[Unit]
Wants=enable-transition-markers.service
After=enable-transition-markers.service

[Service]
# Westeros' device backend takes the place of the EGL native display.
Environment="LD_PRELOAD=/usr/lib/libwesteros_gl.so.0"
# The VM's one DRM device, virtio-gpu. (The Pi's display is card1.)
Environment="WESTEROS_DRM_CARD=/dev/dri/card0"
# It has a single plane: everything is composed with OpenGL ES, and video is
# not on a plane of its own behind the graphics. Not on the Pi.
Environment="WESTEROS_GL_NO_PLANES=1"
Environment="WESTEROS_GL_USE_PREFERRED_MODE=1"
Environment="WESTEROS_SINK_USE_ESSRMGR=1"
Environment="WESTEROS_SINK_USE_FREERUN=1"
Environment="WESTEROS_GL_USE_GENERIC_AVSYNC=1"
Environment="WESTEROS_GL_USE_REFRESH_LOCK=1"
Environment="WESTEROS_GL_GRAPHICS_MAX_SIZE=1920x1080"
# Not the Pi's PLAYERSINKBIN_USE_WESTEROSSINK and AAMP_ENABLE_WESTEROS_SINK:
# they name westerossink, a device's sink that decodes in hardware. Here
# FFmpeg decodes, and GStreamer's playbin finds the sink for decoded frames
# (westerosrawsink, recipe westeros-sink) by itself.
#
# RDK's window manager waits before each drawing: 1000 ms divided by this
# number (25 ms unless told otherwise), whatever the drawing took. Its swap
# then waits for Westeros' refresh thread, which comes round once for each
# refresh of the display (60 a second). The wait and the drawing have to fit
# in one round, or a picture takes two: so the wait is 1 ms, and the swap is
# what paces the window manager. With 60 here (16 ms) the display got 28 to
# 36 pictures a second, with 250 it got 59 to 60 and with 1000 it gets 60,
# also while a 1920x1080 stream of 60 frames a second plays. This needs
# Westeros' patches (recipes-graphics/westeros, recipes-graphics/westeros-soc).
Environment="RDK_WINDOW_MANAGER_FRAMERATE=1000"
#
# The sink hands a frame to Westeros as two buffers of the DRM device
# (brightness, colour). Westeros takes them as one two-plane image when OpenGL
# ES has external images, and Mesa's llvmpipe then draws that image black; told
# that there are none, Westeros takes each buffer as an image of its own and
# converts the colours itself, which works.
Environment="MESA_EXTENSION_OVERRIDE=-GL_OES_EGL_image_external"
#
# The VM has no decoder for Dolby's formats, so AAMP is told to take a
# stream's other sound tracks (AAC).
Environment="AAMP_CFG_TEXT=disableEC3=true,disableAC3=true,disableATMOS=true,disableAC4=true"
Environment="WESTEROS_GL_NO_VBLANK=1"
