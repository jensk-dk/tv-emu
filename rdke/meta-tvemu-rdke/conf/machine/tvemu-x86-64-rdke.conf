#@TYPE: Machine
#@NAME: tvemu-x86-64-rdke
#@NEEDED_BSPLAYERS: none (QEMU's "q35" board, from openembedded-core)
#@DESCRIPTION: RDK-E on tv-emu's x86-64 virtual machine: host-native on an x86-64 host
#@RDK_FLAVOR: rdkv
#
# The x86-64 twin of tvemu-arm64-rdke, for a host-native VM on an x86-64 host
# (KVM on Linux). It is the same fusion with another hardware half:
#
#   raspberrypi4-64-rdke  meta-product-raspberrypi, RDK-E's reference machine:
#                         everything that makes a machine an RDK-E machine
#   qemux86-64            openembedded-core: everything about the hardware
#                         (QEMU's "q35" board with virtio devices, its kernel,
#                         its consoles, Mesa as the graphics stack)
#
# What is said in tvemu-arm64-rdke.conf holds here unless a block says
# otherwise. RDK-E has no public x86-64 build; its middleware layers have a
# virtual-device variant for x86-64 (vdevice_x86-64-mw) whose vendor layer is
# not public. Programs are 64-bit only (TVEMU_USERLAND = "64").

# --- raspberrypi4-64-rdke: unchanged ---------------------------------------
# A .bbappend without its recipe must not stop the parse.
BB_DANGLINGAPPENDS_WARNONLY = "true"

# --- hardware: qemux86-64 in place of raspberrypi4-64 ----------------------
# The tune is qemux86-64's (core2-64): code built for it runs on every x86-64
# host CPU the emulator has (-cpu host under KVM) and on QEMU's simulated ones.
DEFAULTTUNE = "core2-64"
require conf/machine/include/x86/tune-core2.inc
require conf/machine/include/qemu.inc

# As tvemu-arm64-rdke, with "x86" as qemux86-64 has it.
MACHINE_FEATURES = "alsa screen keyboard usbhost pci vfat ext2 rtc x86"

KERNEL_IMAGETYPE = "bzImage"
# The first serial port of the q35 board, and the virtio console.
SERIAL_CONSOLES ?= "115200;ttyS0 115200;hvc0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

# --- overrides: raspberrypi4-64-rdke, with the Pi's names replaced ---------
# As tvemu-arm64-rdke: "qemux86-64" takes the place of the Pi's names, so that
# what openembedded-core and RDK's layers do for that machine applies here.
MACHINEOVERRIDES =. "qemux86-64:"
MACHINEOVERRIDES .= ":tvemu:client:wpe:lxcsecure"

# --- layer includes: raspberrypi4-64-rdke ----------------------------------
# The product and vendor includes are this layer's own (the Pi's are named
# product.inc, vendor.inc and preferred_provider.inc; other names here, so
# that both layers can be in one build). The rest come from RDK-E's common
# layers and are the same for every machine.
require conf/machine/include/tvemu-product.inc
require conf/machine/include/tvemu-vendor.inc
include conf/machine/include/middleware.inc
include conf/machine/include/application.inc

include conf/include/oss-config.inc

include conf/include/rdk-headers-versions.inc
require conf/machine/include/tvemu-preferred-provider.inc

require conf/profile.inc
require conf/rdke-config.inc
require conf/rdke-rdkm-config.inc

# --- image names: raspberrypi4-64-rdke, with the model replaced ------------
MACHINE_IMAGE_NAME = "TVEMU"
DEVICE_MODEL_NUMBER = "TVEMU"
IMAGE_NAME ?= "${IMAGE_BASENAME}-${MACHINE_IMAGE_NAME}${IMAGE_VERSION_SUFFIX}"

# --- image and boot: qemux86-64, as tv-emu's launcher boots a VM ------------
# The Pi builds an SD card image (wic) with a FAT boot partition. tv-emu gives
# QEMU the kernel and the root file system as separate files (build/vm/ARCH:
# vmlinuz, rootfs.img), so the image is a bare ext4 file system and the kernel
# stays out of it, which qemu.inc already arranges.
IMAGE_FSTYPES = "ext4 tar.bz2"
# qemu.inc has every image build QEMU for the build host, for "runqemu". The
# emulator has its own QEMU, and that build takes long.
EXTRA_IMAGEDEPENDS:remove = "qemu-system-native qemu-helper-native:do_addto_recipe_sysroot"

# For Yocto's own "runqemu". The launcher builds its own command line; these
# record what the image expects: virtio disk, network, GPU, input and sound
# on the q35 board.
QB_SYSTEM_NAME = "qemu-system-x86_64"
QB_CPU = "-cpu IvyBridge -machine q35"
QB_CPU_KVM = "-cpu host -machine q35"
QB_SMP = "-smp 4"
QB_MEM = "-m 2048"
QB_GRAPHICS = "-device virtio-gpu-pci"
QB_OPT_APPEND = "-device qemu-xhci -device usb-tablet -device usb-kbd -device virtio-sound-pci"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-pci,drive=disk0"
QB_SERIAL_OPT = "-device virtio-serial-pci -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = "-device virtio-serial-pci -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1 -device virtconsole,chardev=virtcon"
